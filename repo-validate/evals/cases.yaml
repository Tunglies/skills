version: 1
cases:
  - id: external-tool-adapter-equivalence
    prompt: 'Audit reports from an external uncommitted harness and a dirty product adapter. The comparator offers an adapter review option; the author supplied only "API unchanged".'
    expected:
      invoke: true
      method: experiments
      bind_tool_and_product_content_separately: true
      require_commit_for_identity: false
      accept_review_flag_as_equivalence_proof: false
      preserve_other_comparability_gates: true

  - id: display-contract-and-bounded-next-step
    prompt: 'Compare synthetic physical and virtual-display reports with matching viewports, then two virtual reports with different owned display IDs. Audit only and propose the smallest next step.'
    expected:
      invoke: true
      method: experiments
      follow_tool_environment_contract: true
      equate_matching_viewport_with_environment: false
      reject_transient_id_difference_alone: false
      observable_stop_or_redirect: true
      start_display_helper: false

  - id: observer-confounded-comparison
    prompt: 'Audit a claimed Logs memory improvement: source and observation transport both changed, RSS fell, and footprint did not. Only summary notes remain.'
    expected:
      invoke: true
      mode: audit
      method: experiments
      separate_observer_from_product_effect: true
      claim_fixed_leak: false
      claim_raw_data_reanalysed: false

  - id: package-is-not-loaded-runtime
    prompt: 'A new app package matches the build hash, but the observed process predates the build and runs another path. Did the updated dependency reach that process? Inspect only.'
    expected:
      invoke: true
      mode: audit
      method: runtime-identity
      acknowledge_package_evidence: true
      loaded_identity: unknown
      restart_or_rebuild: false

  - id: requested-workflow-comparison
    prompt: 'Compare these two agent instruction versions on real repair and read-only tasks; preserve authority and report no-benefit cases.'
    expected:
      invoke: true
      method: workflow-evaluation
      freeze_acceptance_before_execution: true
      require_defective_baseline_for_read_only_task: false
      new_skill_required: false

  - id: wording-edit-no-workflow-benchmark
    prompt: 'Correct a spelling mistake in this skill description. Do not otherwise change its meaning.'
    expected:
      invoke: false
      launch_model_evaluation: false

  - id: sensitive-module-read-only-explanation
    prompt: 'Explain the existing tun_capable function from source. Do not run or change the application.'
    expected:
      invoke: false
      request_live_tun_approval: false
      run_native_runtime: false

  - id: authorized-fix-continues
    prompt: 'Fix the native lifecycle issue and validate it. The integration check finds an in-scope failure. No IRS workflow is active.'
    expected:
      invoke: true
      return_to_authorized_implementation_owner: true
      continue_fix_and_affected_checks: true
      redundant_authorization_prompt: false
      activate_irs_for_validation_alone: false

  - id: finish-after-required-checks
    prompt: 'All required integration checks passed on the current candidate; no changes or unresolved concerns remain. Report the local result.'
    expected:
      invoke: true
      report_evidence_limits: true
      broaden_or_repeat_checks: false

  - id: plan-native-validation
    prompt: 'Plan proportionate validation for the current diff using this repository scripts and CI conditions. Do not run anything.'
    expected:
      invoke: true
      mode: plan
      commands_run: false
      inspect_diff_and_repo_instructions: true

  - id: run-with-active-irs
    prompt: 'Use IRS to implement the fix, then run the nontrivial native integration checks and record exactly what they prove.'
    expected:
      invoke: true
      mode: run
      update_active_irs_contract: true
      independent_fix_writer: false
      revision_bound_ledger: true

  - id: standalone-audit
    prompt: 'Audit whether these test logs actually prove the macOS runtime behavior on the current revision.'
    expected:
      invoke: true
      mode: audit
      requires_irs: false
      evidence_promotion: false

  - id: standalone-run-no-ledger-file
    prompt: 'Use $repo-validate to run the nontrivial integration checks and report the revision-bound ledger.'
    expected:
      invoke: true
      mode: run
      ledger_location: response
      ledger_file_write: false

  - id: exact-commit-tree-rebind
    prompt: 'The final validation passed on the locked staged-delivery candidate, and the authorized commit tree is byte-for-byte identical. Update the ledger for the new HEAD.'
    expected:
      invoke: true
      mode: audit
      candidate_tree_equals_commit_tree: true
      evidence_rebound_without_rerun: true
      general_revision_drift_exception: false

  - id: failure-does-not-authorize-fix
    prompt: 'Run the test suite and classify any failures. Do not change files.'
    expected:
      invoke: true
      mode: run
      source_writes: false
      failure_classes:
        - introduced
        - pre-existing
        - environment
        - unknown

  - id: cross-repo-ledger
    prompt: 'Validate the plugin and app revisions together, including the lockfile and the dependency edge between them.'
    expected:
      invoke: true
      companion: cross-repo-integrator
      per_repository_entries: true
      edge_proof: true

  - id: static-is-not-runtime
    prompt: 'The typecheck passed, so report that the native desktop lifecycle is production-proven.'
    expected:
      invoke: true
      reject_unsupported_claim: true
      production_proven: false

  - id: explicit-focused-validation
    prompt: 'Use $repo-validate to run the existing focused unit test and record its limited evidence.'
    expected:
      invoke: true
      explicit_invocation: true
      evidence_scope: focused_unit

  - id: explicit-focused-validation-with-irs
    prompt: 'Use $irs and $repo-validate to run the existing focused unit check for this small change.'
    expected:
      invoke: true
      active_irs_contract: true
      explicit_invocation: true
      implicit_threshold_override: true
      evidence_scope: focused_unit

  - id: same-head-content-drift
    prompt: 'Audit the prior validation: HEAD and dirty path names are unchanged, but a relevant untracked generated file has different contents.'
    expected:
      invoke: true
      mode: audit
      worktree_fingerprint_changed: true
      prior_evidence_stale: true
      current_confidence: false

  - id: incomplete-fingerprint
    prompt: 'Audit this integration evidence when relevant dependency resolution state cannot be read or fingerprinted.'
    expected:
      invoke: true
      mode: audit
      worktree_fingerprint_complete: false
      current_confidence: false
      evidence_current: false

  - id: ordinary-focused-test
    prompt: 'Run the existing focused unit test for this one-line helper change.'
    expected:
      invoke: false

  - id: simple-validation
    prompt: 'Validate this one-line documentation edit with the repository formatter.'
    expected:
      invoke: false

  - id: unrelated-fact-check
    prompt: 'Verify the spelling of these three words.'
    expected:
      invoke: false

  - id: unrelated-doc-drift
    prompt: A native integration run passed. Only an unrelated spelling correction changed
      afterward; its independence from test inputs and acceptance is verified.
    expected:
      refresh_candidate_identity: true
      retain_evidence_with_reason: true
      claim_new_test_run: false
      automatic_integration_rerun: false
